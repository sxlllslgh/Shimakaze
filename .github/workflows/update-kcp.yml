# .github/workflows/update-kcp.yml
name: Update kcp submodule

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Update kcp submodule
        run: |
          git submodule update --init --remote kcp
          git add kcp

          if git diff --cached --quiet; then
            echo "No update"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Update kcp submodule"
          git push